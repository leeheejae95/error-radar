spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: error-radar-group
      auto-offset-reset: earliest # 토픽에 쌓인 메시지 처음부터 읽기
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: jdbc:mysql://localhost:3306/errorradar
    username: errorradar
    password: errorradar
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: error-radar

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: 3600000      # 1시간 (ms)
  refresh-token-expiry: 604800000   # 7일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 에러 임계치 설정
alert:
  threshold:
    count: 3            # 에러 발생 횟수
    window-minutes: 30  # 시간 윈도우 (분)
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}